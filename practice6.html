<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        $('button').click(function(){
            $('h1').css('color', 'red');
            $('p').css('background-color', 'yellow');
            $('img').attr('src', 'https://placehold.co/200X200');
            $('#t1').text('<a href="https://www.syu.ac.kr/"></a>');
            $('#t2').html('<a href="https://www.syu.ac.kr/">html()</a>');
            $('#t1').toggleClass('c1');
        });
    });
</script>
<style>
    .c1{color:blue;}
</style>
<body>
    <h1>jQuery 예제</h1>
    <p>삼육대학교</p>
    <p id="t1">인공지능융합학부</p>
    <p id="t2">웹프로그래밍</p>
    <image><br>
    <image src="https://placehold.co/100X100"><br>
    <button>클릭하세요.</button>
</body>
</html>
